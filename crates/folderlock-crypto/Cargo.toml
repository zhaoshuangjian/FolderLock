[package]
name = "folderlock-crypto"
version = "0.1.0"
edition = "2021"
description = "FolderLock vault format: AES-256-GCM, Argon2id, recovery keys"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
